<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KZ Links</title>
    <meta
      name="description"
      content="Create short, shareable links that expire after 30 days."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://links.kevinzheng.fyi/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://links.kevinzheng.fyi/" />
    <meta property="og:title" content="KZ Links" />
    <meta
      property="og:description"
      content="Create short, shareable links that expire after 30 days."
    />
    <meta
      property="og:image"
      content="https://links.kevinzheng.fyi/icon.png"
    />
    <meta property="og:image:alt" content="KZ Links short link generator" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KZ Links" />
    <meta
      name="twitter:description"
      content="Create short, shareable links that expire after 30 days."
    />
    <meta
      name="twitter:image"
      content="https://links.kevinzheng.fyi/og-image.svg"
    />
    <meta name="twitter:image:alt" content="KZ Links short link generator" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="theme-color" content="#f5f4ef" />
    <script src="./index.js" type="module"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <button id="th" aria-label="Toggle theme">
      <svg
        id="ic-moon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
      <svg
        id="ic-sun"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="display: none"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
        />
      </svg>
    </button>
    <div class="w">
      <h1>🔗 KZ Links</h1>
      <p class="sub">
        Short links for share URLs &amp; whatever else. Links expire after 30
        days.
      </p>
      <div class="card">
        <div class="row">
          <input
            id="u"
            placeholder="Paste a long URL…"
            onkeydown="if (event.key === 'Enter') go();"
          />
          <button onclick="go()">Shorten</button>
        </div>
        <div id="out">
          <div class="short" id="short"></div>
          <div class="meta" id="meta"></div>
        </div>
        <div id="err"></div>
      </div>
      <h2>Recent</h2>
      <div class="hist" id="hist"></div>
    </div>
  </body>
</html>
